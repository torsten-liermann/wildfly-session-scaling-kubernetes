# No sticky sessions: the ingress controller spreads requests over all ready replicas,
# and every replica can serve every session.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: session-scaling
  labels:
    app.kubernetes.io/name: session-scaling
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: session-scaling
                port:
                  name: http
