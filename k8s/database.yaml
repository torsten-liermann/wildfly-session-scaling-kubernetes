# PostgreSQL for the demo: one replica, data in an emptyDir. The schema and the catalog come from
# database/schema.sql (ConfigMap, see kustomization.yaml). User name and password are in the Secret
# session-scaling-db, which is not part of the repository (scripts/verify-session-scaling.sh creates it).
# Production databases usually run outside the cluster or under an operator; this one exists so that
# the second-level cache can be shown against a real database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-scaling-db
  labels:
    app.kubernetes.io/name: session-scaling-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: session-scaling-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: session-scaling-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        # User postgres of the Alpine image
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: orders
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: session-scaling-db
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: session-scaling-db
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "--host=127.0.0.1", "--dbname=orders"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: schema
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: schema
          configMap:
            name: session-scaling-db-schema
---
apiVersion: v1
kind: Service
metadata:
  name: session-scaling-db
  labels:
    app.kubernetes.io/name: session-scaling-db
spec:
  selector:
    app.kubernetes.io/name: session-scaling-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
