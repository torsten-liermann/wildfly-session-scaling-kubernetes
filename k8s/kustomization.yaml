apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: session-scaling
labels:
  - pairs:
      app.kubernetes.io/part-of: wildfly-session-scaling
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - service-discovery.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - database.yaml
configMapGenerator:
  - name: session-scaling-db-schema
    files:
      - database/schema.sql
